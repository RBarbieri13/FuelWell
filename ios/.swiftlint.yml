strict: true

included:
  - FuelWellApp
  - Features
  - Packages

excluded:
  - .build
  - DerivedData
  - fastlane
  - docs
  - Packages/**/.build

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - no_extension_access_modifier
  - redundant_void_return

analyzer_rules:
  - explicit_self
  - unused_declaration
  - unused_import

custom_rules:
  no_print:
    name: "No Print"
    regex: "\\bprint\\s*\\("
    message: "Use structured logging instead of print()."
    severity: error

disabled_rules:
  - trailing_comma

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

reporter: xcode
