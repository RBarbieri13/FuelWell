name: FuelWellApp
options:
  bundleIdPrefix: com.fuelwell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  AnthropicClient:
    path: Packages/AnthropicClient
  SupabaseClient:
    path: Packages/SupabaseClient
  HealthKitClient:
    path: Packages/HealthKitClient
  Analytics:
    path: Packages/Analytics
  CrashReporting:
    path: Packages/CrashReporting
  NutritionDomain:
    path: Packages/NutritionDomain
  NutritionFeature:
    path: Features/Nutrition
  Networking:
    path: Packages/Networking
  Persistence:
    path: Packages/Persistence
  SubscriptionClient:
    path: Packages/SubscriptionClient
  App:
    path: Features/App
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
targets:
  FuelWellApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuelWellApp/Sources
      - path: FuelWellApp/Resources
        buildPhase: resources
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    # Release-binding keys live in an explicit Info.plist because
    # INFOPLIST_KEY_* build settings only cover Apple's known-key allowlist:
    # custom keys (FuelWell*) are silently dropped from the generated plist,
    # which left every build without its release binding. Explicit plist
    # values DO substitute $(BUILD_SETTINGS) at process-Info.plist time.
    info:
      path: FuelWellApp/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.fuelwell.app.auth
            CFBundleURLSchemes:
              - fuelwell
        FuelWellExpectedDeploymentID: "$(FUELWELL_EXPECTED_DEPLOYMENT_ID)"
        FuelWellExpectedDeploymentURL: "$(FUELWELL_EXPECTED_DEPLOYMENT_URL)"
        FuelWellExpectedEnvironment: "$(FUELWELL_EXPECTED_ENVIRONMENT)"
        FuelWellExpectedGitSHA: "$(FUELWELL_EXPECTED_GIT_SHA)"
        FuelWellExpectedPackageVersion: "$(FUELWELL_EXPECTED_PACKAGE_VERSION)"
        FuelWellReleaseSchemaVersion: "$(FUELWELL_RELEASE_SCHEMA_VERSION)"
        FuelWellStartURL: "$(FUELWELL_START_URL)"
        FuelWellSupabaseURL: "$(FUELWELL_SUPABASE_URL)"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: FuelWell uses the camera to log meal photos for nutrition tracking.
        NSHealthShareUsageDescription: FuelWell reads workouts, sleep, steps, energy, and body measurements to personalize coaching.
        NSHealthUpdateUsageDescription: FuelWell does not write Health data in this phase.
        NSLocationWhenInUseUsageDescription: FuelWell uses your location while the app is open to improve outdoor activity and nearby grocery guidance.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIImageName: FuelWellLaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuelwell.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FuelWellApp/FuelWellApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  FuelWellAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuelWellApp/Tests
    dependencies:
      - target: FuelWellApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Features/App/Tests/AppTests
    dependencies:
      - package: App
        product: App
      - package: Analytics
        product: Analytics
      - package: AnthropicClient
        product: AnthropicClient
      - package: CrashReporting
        product: CrashReporting
      - package: HealthKitClient
        product: HealthKitClient
      - package: NutritionDomain
        product: NutritionDomain
      - package: SupabaseClient
        product: SupabaseClient
      - package: SubscriptionClient
        product: SubscriptionClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DesignSystemTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/DesignSystem/Tests/DesignSystemTests
    dependencies:
      - package: DesignSystem
        product: DesignSystem
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Core/Tests/CoreTests
    dependencies:
      - package: Core
        product: Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PersistenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Persistence/Tests/PersistenceTests
    dependencies:
      - package: Persistence
        product: Persistence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnthropicClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/AnthropicClient/Tests/AnthropicClientTests
    dependencies:
      - package: AnthropicClient
        product: AnthropicClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SupabaseClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SupabaseClient/Tests/SupabaseClientTests
    dependencies:
      - package: SupabaseClient
        product: SupabaseClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SubscriptionClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SubscriptionClient/Tests/SubscriptionClientTests
    dependencies:
      - package: SubscriptionClient
        product: SubscriptionClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HealthKitClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/HealthKitClient/Tests/HealthKitClientTests
    dependencies:
      - package: HealthKitClient
        product: HealthKitClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnalyticsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Analytics/Tests/AnalyticsTests
    dependencies:
      - package: Analytics
        product: Analytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CrashReportingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/CrashReporting/Tests/CrashReportingTests
    dependencies:
      - package: CrashReporting
        product: CrashReporting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NutritionDomainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/NutritionDomain/Tests/NutritionDomainTests
    dependencies:
      - package: NutritionDomain
        product: NutritionDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NutritionFeatureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Features/Nutrition/Tests/NutritionTests
    dependencies:
      - package: NutritionFeature
        product: Nutrition
      - package: Core
        product: Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FuelWellUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuelWellUITests
    dependencies:
      - target: FuelWellApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FuelWellApp
schemes:
  CandidateUITests:
    build:
      targets:
        FuelWellApp: all
        FuelWellUITests: [test]
    test:
      config: Debug
      environmentVariables:
        FUELWELL_UI_TEST_EMAIL: "$(FUELWELL_UI_TEST_EMAIL)"
        FUELWELL_UI_TEST_PASSWORD: "$(FUELWELL_UI_TEST_PASSWORD)"
      targets:
        - FuelWellUITests
  ReleaseBindingTests:
    build:
      targets:
        FuelWellApp: all
        FuelWellAppTests: [test]
    test:
      config: Debug
      targets:
        - FuelWellAppTests
  FuelWellApp:
    build:
      targets:
        FuelWellApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FuelWellAppTests
        - AppTests
        - DesignSystemTests
        - CoreTests
        - PersistenceTests
        - AnthropicClientTests
        - SupabaseClientTests
        - SubscriptionClientTests
        - HealthKitClientTests
        - AnalyticsTests
        - CrashReportingTests
        - NutritionDomainTests
        - NutritionFeatureTests
        - FuelWellUITests
