name: FuelWellApp
options:
  bundleIdPrefix: com.fuelwell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Networking:
    path: Packages/Networking
  Persistence:
    path: Packages/Persistence
  App:
    path: Features/App
targets:
  FuelWellApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuelWellApp/Sources
    dependencies:
      - package: App
        product: App
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuelwell.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Features/App/Tests/AppTests
    dependencies:
      - package: App
        product: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DesignSystemTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/DesignSystem/Tests/DesignSystemTests
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FuelWellApp:
    build:
      targets:
        FuelWellApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AppTests
        - DesignSystemTests
