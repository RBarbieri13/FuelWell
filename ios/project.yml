name: FuelWellApp
options:
  bundleIdPrefix: com.fuelwell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  AnthropicClient:
    path: Packages/AnthropicClient
  SupabaseClient:
    path: Packages/SupabaseClient
  HealthKitClient:
    path: Packages/HealthKitClient
  Analytics:
    path: Packages/Analytics
  CrashReporting:
    path: Packages/CrashReporting
  Nutrition:
    path: Packages/Nutrition
  Networking:
    path: Packages/Networking
  Persistence:
    path: Packages/Persistence
  App:
    path: Features/App
targets:
  FuelWellApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuelWellApp/Sources
    dependencies:
      - package: App
        product: App
      - package: DesignSystem
        product: DesignSystem
      - package: Analytics
        product: Analytics
      - package: AnthropicClient
        product: AnthropicClient
      - package: CrashReporting
        product: CrashReporting
      - package: HealthKitClient
        product: HealthKitClient
      - package: Nutrition
        product: Nutrition
      - package: SupabaseClient
        product: SupabaseClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuelwell.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: FuelWell reads workouts, sleep, steps, energy, and body measurements to personalize coaching.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: FuelWell does not write Health data in this phase.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Features/App/Tests/AppTests
    dependencies:
      - package: App
        product: App
      - package: Analytics
        product: Analytics
      - package: AnthropicClient
        product: AnthropicClient
      - package: CrashReporting
        product: CrashReporting
      - package: HealthKitClient
        product: HealthKitClient
      - package: Nutrition
        product: Nutrition
      - package: SupabaseClient
        product: SupabaseClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DesignSystemTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/DesignSystem/Tests/DesignSystemTests
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnthropicClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/AnthropicClient/Tests/AnthropicClientTests
    dependencies:
      - package: AnthropicClient
        product: AnthropicClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SupabaseClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SupabaseClient/Tests/SupabaseClientTests
    dependencies:
      - package: SupabaseClient
        product: SupabaseClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HealthKitClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/HealthKitClient/Tests/HealthKitClientTests
    dependencies:
      - package: HealthKitClient
        product: HealthKitClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnalyticsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Analytics/Tests/AnalyticsTests
    dependencies:
      - package: Analytics
        product: Analytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CrashReportingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/CrashReporting/Tests/CrashReportingTests
    dependencies:
      - package: CrashReporting
        product: CrashReporting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NutritionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/Nutrition/Tests/NutritionTests
    dependencies:
      - package: Nutrition
        product: Nutrition
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FuelWellApp:
    build:
      targets:
        FuelWellApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AppTests
        - DesignSystemTests
        - AnthropicClientTests
        - SupabaseClientTests
        - HealthKitClientTests
        - AnalyticsTests
        - CrashReportingTests
        - NutritionTests
