name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional explicit build number. Leave blank to use UTC timestamp."
        required: false
        type: string
      changelog:
        description: "TestFlight changelog shown to internal testers."
        required: false
        default: "FuelWell pilot build."
        type: string
      candidate_url:
        description: "Immutable Vercel deployment origin, without a path."
        required: true
        type: string
      candidate_git_sha:
        description: "Exact Git SHA reported by the candidate release manifest."
        required: true
        type: string
      candidate_deployment_id:
        description: "Exact Vercel deployment ID reported by the candidate release manifest."
        required: true
        type: string
      candidate_environment:
        description: "Candidate release environment."
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      allow_anonymous_candidate:
        description: "Verify the candidate anonymously (preview-mode candidates without a dedicated test login)."
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ios

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FUELWELL_UI_TEST_ALLOW_ANONYMOUS: ${{ inputs.allow_anonymous_candidate && '1' || '0' }}
  FUELWELL_APP_IDENTIFIER: ${{ secrets.FUELWELL_APP_IDENTIFIER }}
  FUELWELL_APPLE_ID: ${{ secrets.FUELWELL_APPLE_ID }}
  FUELWELL_APPLE_TEAM_ID: ${{ secrets.FUELWELL_APPLE_TEAM_ID }}
  FUELWELL_APP_STORE_CONNECT_TEAM_ID: ${{ secrets.FUELWELL_APP_STORE_CONNECT_TEAM_ID }}
  FUELWELL_MATCH_GIT_URL: ${{ secrets.FUELWELL_MATCH_GIT_URL }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
  FUELWELL_ASC_KEY_ID: ${{ secrets.FUELWELL_ASC_KEY_ID }}
  FUELWELL_ASC_ISSUER_ID: ${{ secrets.FUELWELL_ASC_ISSUER_ID }}
  FUELWELL_ASC_KEY_P8_BASE64: ${{ secrets.FUELWELL_ASC_KEY_P8_BASE64 }}
  FUELWELL_BUILD_NUMBER: ${{ inputs.build_number }}
  FUELWELL_TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
  FUELWELL_CANDIDATE_URL: ${{ inputs.candidate_url }}
  FUELWELL_CANDIDATE_GIT_SHA: ${{ inputs.candidate_git_sha }}
  FUELWELL_CANDIDATE_DEPLOYMENT_ID: ${{ inputs.candidate_deployment_id }}
  FUELWELL_CANDIDATE_ENVIRONMENT: ${{ inputs.candidate_environment }}
  FUELWELL_UI_TEST_EMAIL: ${{ secrets.FUELWELL_UI_TEST_EMAIL }}
  FUELWELL_UI_TEST_PASSWORD: ${{ secrets.FUELWELL_UI_TEST_PASSWORD }}
  FUELWELL_RELEASE_TEST_DEVICE: "iPhone 17"

jobs:
  testflight:
    name: Build and Upload TestFlight
    runs-on: macos-15
    # A signing or upload hang must fail fast, not burn the 6-hour job limit
    # (attempt 9 hung 5.5h at codesign before setup_ci was added).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        # The release-binding verifier and candidate gates run vitest and
        # Playwright (Chromium + mobile WebKit) from the repo root; npm ci
        # alone does not fetch the browser binaries.
        working-directory: .
        run: |
          npm ci
          npx playwright install chromium webkit

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Load signing key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Regenerate project
        run: xcodegen generate --spec project.yml

      - name: SwiftLint strict
        run: swiftlint --strict --config .swiftlint.yml

      - name: Check feature import direction
        run: scripts/check-feature-imports.sh

      - name: Check theme drift
        run: scripts/check-theme-drift.sh

      - name: Run full test suite
        # FuelWellUITests require candidate-bound build settings and are
        # exercised with them by the dedicated "Verify candidate through the
        # iOS shell" step below; running them here unbound fails by design.
        run: |
          rm -rf build/reports/FuelWellApp.xcresult
          xcodebuild test \
            -scheme FuelWellApp \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -skip-testing:FuelWellUITests \
            -resultBundlePath build/reports/FuelWellApp.xcresult

      - name: Enforce coverage floor
        working-directory: .
        run: tools/release/check-coverage-floor.sh ios/build/reports/FuelWellApp.xcresult

      - name: TestFlight readiness gate
        working-directory: .
        run: tools/release/check-testflight-readiness.sh --ci

      - name: Verify immutable web release binding
        working-directory: .
        run: tools/release/verify-release-binding.sh

      - name: Verify candidate through the iOS shell
        working-directory: .
        run: tools/release/test-ios-candidate-ui.sh

      - name: Upload internal TestFlight build
        run: bundle exec fastlane beta
