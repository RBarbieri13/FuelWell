name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional explicit build number. Leave blank to use UTC timestamp."
        required: false
        type: string
      changelog:
        description: "TestFlight changelog shown to internal testers."
        required: false
        default: "FuelWell pilot build."
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ios

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FUELWELL_APP_IDENTIFIER: ${{ secrets.FUELWELL_APP_IDENTIFIER }}
  FUELWELL_APPLE_ID: ${{ secrets.FUELWELL_APPLE_ID }}
  FUELWELL_APPLE_TEAM_ID: ${{ secrets.FUELWELL_APPLE_TEAM_ID }}
  FUELWELL_APP_STORE_CONNECT_TEAM_ID: ${{ secrets.FUELWELL_APP_STORE_CONNECT_TEAM_ID }}
  FUELWELL_MATCH_GIT_URL: ${{ secrets.FUELWELL_MATCH_GIT_URL }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
  FUELWELL_ASC_KEY_ID: ${{ secrets.FUELWELL_ASC_KEY_ID }}
  FUELWELL_ASC_ISSUER_ID: ${{ secrets.FUELWELL_ASC_ISSUER_ID }}
  FUELWELL_ASC_KEY_P8_BASE64: ${{ secrets.FUELWELL_ASC_KEY_P8_BASE64 }}
  FUELWELL_BUILD_NUMBER: ${{ inputs.build_number }}
  FUELWELL_TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}

jobs:
  testflight:
    name: Build and Upload TestFlight
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode_26_path="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -n 1 || true)"
          if [ -n "$xcode_26_path" ]; then
            sudo xcode-select -s "$xcode_26_path"
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Load signing key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Regenerate project
        run: xcodegen generate --spec project.yml

      - name: SwiftLint strict
        run: swiftlint --strict --config .swiftlint.yml

      - name: Check feature import direction
        run: scripts/check-feature-imports.sh

      - name: Check theme drift
        run: scripts/check-theme-drift.sh

      - name: TestFlight readiness gate
        working-directory: .
        run: tools/release/check-testflight-readiness.sh --ci

      - name: Upload internal TestFlight build
        run: bundle exec fastlane beta

      - name: Show archive log on failure
        if: failure()
        run: |
          latest_log="$(ls -t "$HOME/Library/Logs/gym/"*.log 2>/dev/null | head -n 1 || true)"
          if [ -n "$latest_log" ]; then
            echo "Showing archive log: $latest_log"
            tail -n 400 "$latest_log"
          else
            echo "No gym archive log found."
          fi
