name: Deploy to Fly.io

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Root Web CI
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve target SHA
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Root Web CI gate
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = "${{ steps.target.outputs.sha }}";
            if (context.eventName === "workflow_run") {
              core.info(
                `Root Web CI succeeded for ${targetSha} via workflow run ${context.payload.workflow_run.id}.`,
              );
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "root-web-ci.yml",
              branch: "main",
              event: "push",
              status: "completed",
              per_page: 100,
            });
            const matchingRun = runs.find(
              (run) => run.head_sha === targetSha && run.conclusion === "success",
            );

            if (!matchingRun) {
              core.setFailed(
                `Root Web CI has not passed for ${targetSha}. Run Root Web CI on main before dispatching deploy.`,
              );
              return;
            }

            core.info(
              `Verified Root Web CI run ${matchingRun.id} passed for ${targetSha}.`,
            );

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: >-
          flyctl deploy --remote-only
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
